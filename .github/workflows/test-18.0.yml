name: Test 18.0

on:
  push:
    branches: [18.0]
  pull_request:
    branches: [18.0]

concurrency:
  group: test-18.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      odoo:
        image: odoo:18
        env:
          HOST: db
          USER: odoo
          PASSWORD: odoo

    container:
      image: odoo:18
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps in the Odoo container
        run: |
          pip install --break-system-packages --user opensalestax>=0.1.2

      - name: Install module + run tests
        env:
          PGHOST: db
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --without-demo=all \
            -d ci_test \
            -i account_ostax \
            --test-enable --test-tags /account_ostax \
            --stop-after-init \
            --log-handler odoo.tests:INFO \
            --log-level=warn

  dco-check:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=$(git log --format='%H %s%n%b' "$base..$head" \
            | awk 'BEGIN{RS=""} !/Signed-off-by:/ {print}')
          if [ -n "$missing" ]; then
            echo "Commits missing DCO sign-off:"; echo "$missing"; exit 1
          fi
          echo "All commits signed off."
