# SPDX-License-Identifier: LGPL-3.0-or-later
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-addon-account-ostax"
version = "17.0.0.1.16"
description = "OpenSalesTax connector for Odoo 17 — destination-based US sales tax via the OpenSalesTax engine"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.9"
authors = [{ name = "Eric Osterberg", email = "ejosterberg@gmail.com" }]
keywords = ["odoo", "odoo-addon", "sales-tax", "opensalestax", "tax-calculation", "us-sales-tax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Odoo",
    "Framework :: Odoo :: 17.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "opensalestax>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/ejosterberg/opensalestax-odoo"
Repository = "https://github.com/ejosterberg/opensalestax-odoo"
Issues = "https://github.com/ejosterberg/opensalestax-odoo/issues"
Changelog = "https://github.com/ejosterberg/opensalestax-odoo/blob/17.0/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# Install the addon at <site-packages>/odoo/addons/account_ostax — the
# canonical Odoo addons-path location. Odoo's loader picks it up
# automatically when installed via pip.
packages = []

[tool.hatch.build.targets.wheel.force-include]
"account_ostax" = "odoo/addons/account_ostax"

[tool.hatch.build.targets.sdist]
include = [
    "account_ostax",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "SECURITY-REVIEW.md",
    "pyproject.toml",
]
exclude = [
    "account_ostax/tests",
    "account_ostax/__pycache__",
]
